# =============================================================================
# TripMate AI — Local Development Docker Compose
# =============================================================================
# Spins up PostgreSQL 16 with the official pgvector extension pre-installed.
#
# Usage:
#   docker compose up -d
#
# Connection URL:
#   postgresql://postgres:postgres@localhost:5432/tripagentmemo
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tripmate_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripagentmemo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tripagentmemo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
